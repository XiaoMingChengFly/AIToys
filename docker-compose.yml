# 本地开发和部署共用。
#   docker compose up -d                 只起基础设施和迁移：Postgres、Temporal + UI、zero-cache。api/worker/web 用 pnpm dev 在本机跑
#   docker compose --profile app up -d   连同 api、Temporal worker、Outbox 中继一起起（部署用）
# 端口：Postgres 5432、API 3000、zero-cache 4848、Temporal 7233、Temporal UI 8080
name: feishu-project

x-app: &app
  build: .
  image: feishu-project/app
  restart: unless-stopped
  profiles: [app]
  environment:
    DATABASE_URL: postgresql://feishu:feishu@postgres:5432/feishu
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_TASK_QUEUE: fp-events
    # 部署时务必换成随机长字符串：openssl rand -base64 32
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-in-production}
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:5173}
    # 只有端到端测试设成 off
    AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-on}

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    shm_size: 1g
    restart: unless-stopped
    environment:
      POSTGRES_USER: feishu
      POSTGRES_PASSWORD: feishu
      POSTGRES_DB: postgres
    # Zero 依赖逻辑复制
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feishu"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app
    profiles: []
    restart: "no"
    command: ["node", "packages/db/src/migrate.ts"]
    depends_on:
      postgres: { condition: service_healthy }

  temporal-setup:
    image: temporalio/admin-tools:1.31.0
    restart: on-failure:6
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: temporal
    volumes:
      - ./infra/temporal/scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh

  temporal:
    image: temporalio/server:1.31.0
    restart: unless-stopped
    depends_on:
      temporal-setup: { condition: service_completed_successfully }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-namespace:
    image: temporalio/admin-tools:1.31.0
    restart: on-failure:5
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    volumes:
      - ./infra/temporal/scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh

  temporal-ui:
    image: temporalio/ui:2.49.1
    restart: unless-stopped
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

  zero-cache:
    # 版本要和 packages/sync 里的 @rocicorp/zero 一致
    image: rocicorp/zero:1.10.0
    restart: unless-stopped
    depends_on:
      # publication 由迁移创建
      migrate: { condition: service_completed_successfully }
    environment:
      ZERO_UPSTREAM_DB: postgresql://feishu:feishu@postgres:5432/feishu
      ZERO_CVR_DB: postgresql://feishu:feishu@postgres:5432/zero
      ZERO_CHANGE_DB: postgresql://feishu:feishu@postgres:5432/zero
      ZERO_REPLICA_FILE: /data/zero.db
      ZERO_APP_PUBLICATIONS: zero_pub
      # 查询和写操作转发给 api。开发时 api 在本机跑；用 --profile app 起时设 ZERO_API_ORIGIN=http://api:3000
      ZERO_QUERY_URL: ${ZERO_API_ORIGIN:-http://host.docker.internal:3000}/api/zero/query
      ZERO_MUTATE_URL: ${ZERO_API_ORIGIN:-http://host.docker.internal:3000}/api/zero/mutate
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_MUTATE_FORWARD_COOKIES: "true"
      ZERO_ADMIN_PASSWORD: feishu-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4848:4848"
    volumes:
      - zerodata:/data

  api:
    <<: *app
    command: ["node", "apps/api/src/server.ts"]
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["node", "apps/worker/src/main.ts"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal-namespace: { condition: service_completed_successfully }

  relay:
    <<: *app
    command: ["node", "apps/worker/src/relay-main.ts"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal-namespace: { condition: service_completed_successfully }

volumes:
  pgdata:
  zerodata:
